<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>404 | Stackly Education</title>

   

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">



    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
        rel="stylesheet">


    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>
<style>
 
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:
    radial-gradient(circle at top,#0A74D8 0%,#08111F 35%,#050505 100%);

    overflow:hidden;

    color:#fff;

}


/*=========================================
        ERROR SECTION
=========================================*/

.error-section{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px 20px;

    position:relative;

    overflow:hidden;

}


/*=========================================
        ERROR CARD
=========================================*/

.error-card{

    position:relative;

    width:100%;

    max-width:820px;

    margin:auto;

    padding:55px 45px;

    text-align:center;

    border-radius:28px;

    overflow:hidden;

    z-index:2;

    background:rgba(18,22,30,.75);

    backdrop-filter:blur(22px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 25px 60px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.05);

}


/*=========================================
        TOP GLOW
=========================================*/

.error-card::before{

    content:"";

    position:absolute;

    left:50%;

    top:-180px;

    transform:translateX(-50%);

    width:450px;

    height:450px;

    background:radial-gradient(circle,
        rgba(10,116,216,.28),
        transparent 70%);

    filter:blur(50px);

    animation:glowMove 6s ease-in-out infinite;

    z-index:-1;

}


@keyframes glowMove{

0%,100%{

transform:translateX(-50%) scale(1);

}

50%{

transform:translateX(-50%) scale(1.2);

}

}


/*=========================================
        ICON
=========================================*/

.error-icon{

    width:95px;

    height:95px;

    margin:auto;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:28px;

    background:rgba(10,116,216,.12);

    border:1px solid rgba(10,116,216,.25);

    box-shadow:
        0 0 30px rgba(10,116,216,.25);

    animation:floatIcon 4s ease-in-out infinite;

}


.error-icon i{

    font-size:44px;

    color:#0A74D8;

}


@keyframes floatIcon{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-10px);

}

}


/*=========================================
        BADGE
=========================================*/

.error-badge{

    display:inline-block;

    color:#0A74D8;

    font-size:14px;

    font-weight:600;

    letter-spacing:4px;

    margin-bottom:18px;

}


/*=========================================
        404
=========================================*/

.error-code{

    font-size:105px;

    font-weight:800;

    color:#fff;

    line-height:1;

    margin-bottom:10px;

    text-shadow:

        0 0 25px rgba(10,116,216,.35);

}


/*=========================================
        TITLE
=========================================*/

.error-title{

    color:#fff;

    font-size:36px;

    font-weight:700;

    margin-bottom:22px;

}


/*=========================================
        DESCRIPTION
=========================================*/

.error-description{

    max-width:560px;

    margin:0 auto 40px;

    color:#BFC7D4;

    font-size:17px;

    line-height:1.8;

}


/*=========================================
        BUTTONS
=========================================*/

.error-buttons{

    display:flex;

    justify-content:center;

    gap:18px;

    flex-wrap:wrap;

}


.error-btn{

    min-width:210px;

    height:60px;

    border-radius:50px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:10px;

    font-size:17px;

    font-weight:600;

    transition:.35s;

    text-decoration:none;

}


.back-btn{

    background:transparent;

    border:2px solid #0A74D8;

    color:#fff;

}


.back-btn:hover{

    background:#0A74D8;

    color:#fff;

    transform:translateY(-4px);

    box-shadow:

        0 10px 30px rgba(10,116,216,.35);

}


.home-btn{

    background:#0A74D8;

    color:#fff;

    border:none;

}


.home-btn:hover{

    background:#0C86F7;

    color:#fff;

    transform:translateY(-4px);

    box-shadow:

        0 10px 30px rgba(10,116,216,.45);

}


/*=========================================
        RESPONSIVE
=========================================*/

@media(max-width:992px){

.error-card{

padding:50px 35px;

}

.error-code{

font-size:90px;

}

.error-title{

font-size:30px;

}

}


@media(max-width:768px){

.error-card{

padding:40px 25px;

}

.error-icon{

width:80px;

height:80px;

}

.error-icon i{

font-size:38px;

}

.error-code{

font-size:72px;

}

.error-title{

font-size:24px;

}

.error-description{

font-size:15px;

line-height:1.7;

}

.error-buttons{

flex-direction:column;

}

.error-btn{

width:100%;

min-width:100%;

}

}


@media(max-width:480px){

.error-card{

padding:35px 20px;

}

.error-code{

font-size:60px;

}

.error-title{

font-size:22px;

}

.error-badge{

font-size:12px;

letter-spacing:2px;

}

}


.floating-icon{

    position:absolute;

    color:rgba(255,255,255,.05);

    font-size:55px;

    animation:floating 8s infinite ease-in-out;

}

.icon1{

top:8%;

left:8%;

}

.icon2{

top:18%;

right:10%;

animation-delay:1s;

}

.icon3{

bottom:15%;

left:12%;

animation-delay:2s;

}

.icon4{

bottom:10%;

right:12%;

animation-delay:3s;

}

.icon5{

top:50%;

left:4%;

animation-delay:4s;

}

.icon6{

top:55%;

right:4%;

animation-delay:5s;

}

@keyframes floating{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-25px);

}

}


@media(max-width:991px){

.error-card{

padding:60px 35px;

}

.error-code{

font-size:110px;

}

.error-title{

font-size:34px;

}

}

@media(max-width:768px){

.error-card{

padding:45px 25px;

}

.error-code{

font-size:80px;

}

.error-title{

font-size:28px;

}

.error-description{

font-size:16px;

}

.error-btn{

width:100%;

}

.error-buttons{

flex-direction:column;

}

.error-icon{

width:95px;

height:95px;

}

.error-icon i{

font-size:45px;

}

}

@media(max-width:480px){

.error-code{

font-size:70px;

}

.error-title{

font-size:24px;

}

.error-description{

font-size:15px;

}

.error-badge{

font-size:12px;

letter-spacing:2px;

}

}
.error-btn{

    position:relative;

    overflow:hidden;

}

.error-btn::before{

    content:"";

    position:absolute;

    width:0;

    height:0;

    left:var(--x);

    top:var(--y);

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:rgba(255,255,255,.15);

    transition:.55s;

}

.error-btn:hover::before{

    width:350px;

    height:350px;

}
</style>

<body>

    <i class="ri-book-open-line floating-icon icon1"></i>

    <i class="ri-graduation-cap-line floating-icon icon2"></i>

    <i class="ri-medal-line floating-icon icon3"></i>

    <i class="ri-lightbulb-flash-line floating-icon icon4"></i>

    <i class="ri-computer-line floating-icon icon5"></i>

    <i class="ri-pencil-ruler-2-line floating-icon icon6"></i>


    <section class="error-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <div class="error-card">

                        <div class="error-icon">

                            <i class="ri-book-open-fill"></i>

                        </div>


                        <span class="error-badge">

                            STACKLY EDUCATION

                        </span>

               

                        <h1 class="error-code">

                            404

                        </h1>

                

                        <h2 class="error-title">

                            Learning Resource Not Found

                        </h2>

                 

                        <p class="error-description">

                            The page or learning resource you're trying to access
                            doesn't exist or may have been moved.

                            Continue your learning journey using one of the options below.

                        </p>

                        <div class="error-buttons">

                            <button
                              class="btn error-btn back-btn"
                                id="goBack">

                                <i class="ri-arrow-left-line"></i>

                                Go Back

                            </button>
                             

                            <a href="index.html"
                                class="btn error-btn home-btn">

                                <i class="ri-home-5-fill"></i>

                                Back To Home

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
window.addEventListener("load",()=>{

    document.body.style.opacity="0";

    setTimeout(()=>{

        document.body.style.transition="opacity .8s ease";

        document.body.style.opacity="1";

    },100);

});


// const backBtn = document.getElementById("goBack");

// backBtn.addEventListener("click",()=>{

//     Swal.fire({

//         title:"Return to Previous Page?",

//         text:"You'll be redirected to your last visited page.",

//         icon:"question",

//         background:"#111",

//         color:"#fff",

//         confirmButtonColor:"#0A74D8",

//         confirmButtonText:"Go Back",

//         cancelButtonText:"Cancel",

//         showCancelButton:true,

//         reverseButtons:true

//     }).then((result)=>{

//         if(result.isConfirmed){

//             history.back();

//         }

//     });

// });


const goBackBtn = document.getElementById("goBack");

goBackBtn.addEventListener("click", function () {

    window.history.back();

});
const homeBtn = document.querySelector(".home-btn");

homeBtn.addEventListener("click",(e)=>{

    e.preventDefault();

    Swal.fire({

        icon:"success",

        title:"Returning Home",

        text:"Continue your learning journey with Stackly Education.",

        background:"#111",

        color:"#fff",

        confirmButtonColor:"#0A74D8",

        confirmButtonText:"Go Home",

        allowOutsideClick:false

    }).then((result)=>{

        if(result.isConfirmed){

            window.location.href="index.html";

        }

    });

});

document.querySelectorAll(".error-btn").forEach(button=>{

    button.addEventListener("mousemove",(e)=>{

        const rect=button.getBoundingClientRect();

        const x=e.clientX-rect.left;

        const y=e.clientY-rect.top;

        button.style.setProperty("--x",x+"px");

        button.style.setProperty("--y",y+"px");

    });

});

document.addEventListener("mousemove",(e)=>{

    const icons=document.querySelectorAll(".floating-icon");

    icons.forEach((icon,index)=>{

        const speed=(index+1)*0.008;

        const x=(window.innerWidth/2-e.clientX)*speed;

        const y=(window.innerHeight/2-e.clientY)*speed;

        icon.style.transform=`translate(${x}px,${y}px)`;

    });

});
    </script>

</body>

</html>
