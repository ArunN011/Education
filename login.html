<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Stackly Education</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
          rel="stylesheet">


    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css"
          rel="stylesheet">
  
   <link rel="stylesheet" href="loader.css">
  

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet"
          href="login.css">

</head>

<body>

<div class="cursor-dot"></div>
<div class="cursor-outline"></div>
  
<div id="preloader">
    <div class="loader-bg"></div>

    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>
    <span class="particle p5"></span>
 <div class="loader-content">
        <img
            src="stacklylogoimg.png"
            class="loader-logo"
            alt="Stackly Logo">
        <img
            src="stacklyletter.png"
            class="loader-text"
            alt="Stackly">

        <h4 class="loader-title">
            Empowering Education Through Technology
        </h4>
        <p id="loading-message">

            Preparing Your Learning Experience...

        </p>
        <div class="progress-box">

            <div class="progress-fill"></div>

        </div>

        <h5 id="loading-percent">

            0%

        </h5>

    </div>

</div>

 <div id="website">




<section class="login-section">

    <div class="login-wrapper">


        <div class="login-top">

            <a href="index.html"
               class="back-home-btn">

                <i class="ri-arrow-left-line"></i>

                Back To Home

            </a>

        </div>


        <div class="login-card">

            <span class="login-badge">

                <i class="ri-login-circle-fill"></i>

                Login Account

            </span>

            <h2>

                Welcome Back

                <span>

                    Stackly

                </span>

            </h2>

            <p>

                Login to continue your learning journey.

            </p>


            <form id="loginForm">

           

                <div class="mb-4">

                    <label>

                        Email Address

                    </label>

                    <input

                        type="email"

                        id="loginEmail"

                        class="form-control custom-input"

                        placeholder="Enter your email">

                    <small

                        id="emailError"

                        class="error-text">

                    </small>

                </div>


                <div class="mb-4">

                    <label>

                        Password

                    </label>

                    <div class="password-box">

                        <input

                            type="password"

                            id="loginPassword"

                            class="form-control custom-input"

                            placeholder="Enter password">

                        <i

                            class="ri-eye-line togglePassword"

                            toggle="#loginPassword">

                        </i>

                    </div>

                    <small

                        id="passwordError"

                        class="error-text">

                    </small>

                </div>

                <div class="mb-4">

                    <label>

                        Select Role

                    </label>

                    <select

                        id="loginRole"

                        class="form-select custom-input">

                        <option value="">

                            Select Role

                        </option>

                        <option value="student">

                            Student

                        </option>

                        <option value="admin">

                            Admin

                        </option>

                    </select>

                    <small

                        id="roleError"

                        class="error-text">

                    </small>

                </div>

              

                <div class="remember-forgot">

                    <div class="form-check">

                        <input

                            class="form-check-input"

                            type="checkbox"

                            id="rememberMe">

                        <label

                            class="form-check-label"

                            for="rememberMe">

                            Remember Me

                        </label>

                    </div>

                    <a href="#"

                       id="forgotPassword">

                        Forgot Password?

                    </a>

                </div>

            
                <button

                    type="submit"

                    class="login-btn">

                    <i class="ri-login-circle-fill"></i>

                    Login

                </button>

            </form>


            <div class="divider">

                <span>

                    OR

                </span>

            </div>


            <div class="social-login">

                <a href="#"
                   class="social-btn">

                    <i class="ri-google-fill"></i>

                </a>

                <a href="#"
                   class="social-btn">

                    <i class="ri-github-fill"></i>

                </a>

                <a href="#"
                   class="social-btn">

                    <i class="ri-linkedin-box-fill"></i>

                </a>

            </div>

           

            <div class="register-link">

                Don't have an account?

                <a href="signup.html">

                    Register

                </a>

            </div>

        </div>

    </div>



</section>


 </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


<script src="loader.js"></script>
<script src="cursor.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
  

const loginForm = document.getElementById("loginForm");

const loginEmail = document.getElementById("loginEmail");
const loginPassword = document.getElementById("loginPassword");
const loginRole = document.getElementById("loginRole");

const rememberMe = document.getElementById("rememberMe");

const emailError = document.getElementById("emailError");
const passwordError = document.getElementById("passwordError");
const roleError = document.getElementById("roleError");


document.querySelectorAll(".togglePassword").forEach(icon=>{

icon.addEventListener("click",function(){

const input=document.querySelector(this.getAttribute("toggle"));

if(input.type==="password"){

input.type="text";

this.classList.replace("ri-eye-line","ri-eye-off-line");

}
else{

input.type="password";

this.classList.replace("ri-eye-off-line","ri-eye-line");

}

});

});

function showError(input,error,message){

input.classList.add("input-error");

input.classList.remove("input-success");

error.innerHTML=message;

}

function showSuccess(input,error){

input.classList.remove("input-error");

input.classList.add("input-success");

error.innerHTML="";

}


function validateEmail(){

const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(loginEmail.value.trim()===""){

showError(

loginEmail,

emailError,

"Email Address is required."

);

return false;

}

if(!emailPattern.test(loginEmail.value.trim())){

showError(

loginEmail,

emailError,

"Enter a valid Email Address."

);

return false;

}

showSuccess(loginEmail,emailError);

return true;

}


function validatePassword(){

if(loginPassword.value.trim()===""){

showError(

loginPassword,

passwordError,

"Password is required."

);

return false;

}

if(loginPassword.value.length<8){

showError(

loginPassword,

passwordError,

"Minimum 8 characters required."

);

return false;

}

showSuccess(loginPassword,passwordError);

return true;

}


function validateRole(){

if(loginRole.value===""){

showError(

loginRole,

roleError,

"Please select your role."

);

return false;

}

showSuccess(loginRole,roleError);

return true;

}



loginEmail.addEventListener(

"input",

validateEmail

);

loginPassword.addEventListener(

"input",

validatePassword

);

loginRole.addEventListener(

"change",

validateRole

);


window.addEventListener("load",()=>{

const savedEmail=localStorage.getItem("rememberEmail");

if(savedEmail){

loginEmail.value=savedEmail;

rememberMe.checked=true;

}

});


loginForm.addEventListener("submit",function(e){

e.preventDefault();

const valid=

validateEmail() &

validatePassword() &

validateRole();

if(!valid) return;



if(rememberMe.checked){

localStorage.setItem(

"rememberEmail",

loginEmail.value

);

}
else{

localStorage.removeItem(

"rememberEmail"

);

}


localStorage.setItem(

"userEmail",

loginEmail.value

);

localStorage.setItem(

"userRole",

loginRole.value

);



Swal.fire({

icon:"success",

title:"Login Successful",

html:`

<h3 style="color:#58A6FF;">

Welcome

${loginRole.value==="admin" ? "Administrator" : "Student"}

</h3>

<p>

Redirecting to your dashboard...

</p>

`,

background:"#171717",

color:"#fff",

confirmButtonColor:"#0A74D8",

confirmButtonText:"Continue"

}).then((result)=>{

if(result.isConfirmed){

if(loginRole.value==="admin"){

window.location.href="admin-dashboard.html";

}
else{

window.location.href="student-dashboard.html";

}

}

});

});


document.getElementById("forgotPassword")

.addEventListener("click",function(e){

e.preventDefault();

Swal.fire({

icon:"info",

title:"Forgot Password",

text:"Password recovery page will be available soon.",

background:"#171717",

color:"#fff",

confirmButtonColor:"#0A74D8"

}).then(()=>{

window.location.href="error.html";

});

});



document.querySelectorAll(".social-btn")

.forEach(btn=>{

btn.addEventListener("click",function(e){

e.preventDefault();

Swal.fire({

icon:"info",

title:"Social Login",

text:"This feature is under development.",

background:"#171717",

color:"#fff",

confirmButtonColor:"#0A74D8"

}).then(()=>{

window.location.href="error.html";

});

});

});



AOS.init({

duration:1000,

once:true,

offset:80

});
</script>

</body>

</html>
